version: "3.8"

services:
  backend:
    build: .
    container_name: melooha-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./melooha.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEBUG=True
    volumes:
      - .:/app
    restart: unless-stopped
