services:
  - type: web
    name: melooha-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: melooha-db
          property: connectionString
      - key: ENABLE_OFFLINE_DEMO
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: melooha-db
    databaseName: melooha
    user: melooha_user
    plan: free
